<div appear class="mx-auto max-w-sm pt-6 sm:pt-12">
  <h1 class="text-xl font-semibold">Log in</h1>
  <p class="mt-1 text-sm text-gray-600">
    Recruiters can add and edit candidates. Admins can also delete them.
  </p>

  <form
    #card
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="mt-6 space-y-4 rounded-lg border border-gray-200 bg-white p-6 shadow-sm"
  >
    <label class="block text-sm">
      <span class="font-medium text-gray-700">Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none [&.ng-invalid.ng-touched]:border-red-500"
      />
    </label>

    <div class="text-sm">
      <div class="flex items-center justify-between">
        <label for="password" class="font-medium text-gray-700">Password</label>
        <button
          type="button"
          (click)="showPassword.set(!showPassword())"
          class="text-xs text-gray-500 hover:text-gray-700"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </div>
      <input
        id="password"
        [type]="showPassword() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
        class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none [&.ng-invalid.ng-touched]:border-red-500"
      />
    </div>

    @if (error()) {
      <p class="text-sm text-red-600">{{ error() }}</p>
    }

    <button
      [disabled]="loading()"
      class="w-full rounded-md bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 disabled:opacity-60"
    >
      {{ loading() ? 'Logging in…' : 'Log in' }}
    </button>
  </form>

  <div class="mt-4 rounded-lg border border-gray-200 bg-white p-4 text-sm">
    <p class="font-medium text-gray-700">Demo accounts</p>
    <ul class="mt-2 divide-y divide-gray-100">
      <li class="flex items-center justify-between py-2">
        <span>
          <span class="text-gray-900">Recruiter</span>
          <span class="ml-2 text-gray-500">recruiter&#64;portal.dev</span>
        </span>
        <button
          type="button"
          (click)="demo('recruiter@portal.dev', 'Recruiter@123')"
          class="font-medium text-blue-600 hover:text-blue-800"
        >
          Use
        </button>
      </li>
      <li class="flex items-center justify-between py-2">
        <span>
          <span class="text-gray-900">Admin</span>
          <span class="ml-2 text-gray-500">admin&#64;portal.dev</span>
        </span>
        <button
          type="button"
          (click)="demo('admin@portal.dev', 'Admin@123')"
          class="font-medium text-blue-600 hover:text-blue-800"
        >
          Use
        </button>
      </li>
    </ul>
  </div>
</div>
